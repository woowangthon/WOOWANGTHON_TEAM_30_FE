# 여운 FE — Render 설정 기록 (AI 우왕톤 팀 30)
# 지금 서비스(yeoun-team30-web)는 대시보드에서 '공개 저장소 주소'로 만들었고, 아래는 그 설정을 그대로 적은 것이다.
# Render GitHub 앱이 woowangthon 조직에 승인되면 New → Blueprint로 이 파일을 써서 다시 만들 수 있다.
# API는 BE 저장소(woowangthon/WOOWANGTHON_TEAM_30_BE)의 yeoun-team30-api.
services:
  - type: web
    name: yeoun-team30-web
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # API 주소. rewrites는 빌드 때 정해지므로 값을 바꾸면 다시 배포해야 한다.
      - key: YEOUN_API_ORIGIN
        value: https://yeoun-team30-api.onrender.com
